ปลอมบัญชีเพื่อแกล้งคนอื่นไม่เป็นไร|0
ควรปลอบใจและช่วยเหลือเพื่อนที่ถูกแกล้ง|1`}];
function snd(ok){try{const a=new(window.AudioContext||webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type=ok?'triangle':'sawtooth';o.frequency.setValueAtTime(ok?660:220,a.currentTime);if(ok)o.frequency.setValueAtTime(990,a.currentTime+.15);g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.4);o.start();o.stop(a.currentTime+.4)}catch(e){}}
function say(t,k='b'){return new Promise(r=>{$('bub').textContent=t;const c=document.querySelector('.ch.'+k),ss=window.speechSynthesis;if(ss)ss.cancel();c.classList.add('talk');const d=()=>{c.classList.remove('talk');r()};
if(mute||!ss){setTimeout(d,Math.min(4000,t.length*70));return}
const u=new SpeechSynthesisUtterance(t);u.lang='th-TH';u.pitch=k=='g'?1.8:1.4;u.rate=.95;const v=ss.getVoices().find(v=>v.lang.replace('_','-').startsWith('th'));if(v)u.voice=v;u.onend=d;u.onerror=d;ss.speak(u)})}
function ui(h){cur++;$('ui').innerHTML=h;return cur}
function home(){const id=ui(`<div class="panel c"><h1>🛡️ ภารกิจพิชิตภัยไซเบอร์</h1><p>ผจญภัยกับน้องเก่งและน้องใจดี เรียนรู้ 8 เรื่องความปลอดภัยบนอินเทอร์เน็ต</p><button class="btn" onclick="menu()">▶ เริ่มเรียน</button><details><summary>📘 วิธีใช้</summary>เลือกหัวข้อ ดูตัวละครคุย ลองสถานการณ์จำลอง อ่านสรุป แล้วทำแบบทดสอบ 10 ข้อ ต้องกดเริ่มเรียนเพื่อเปิดเสียง</details><details><summary>🎯 เกี่ยวกับ</summary>ได้รู้จักรหัสผ่าน ข้อมูลส่วนตัว ลิงก์หลอกลวง โซเชียล คนแปลกหน้า มัลแวร์ ข่าวปลอม และการกลั่นแกล้งออนไลน์</details></div>`);$('bub').textContent='สวัสดีจ้ะ! มาเรียนรู้ความปลอดภัยบนเน็ตกัน'}
function menu(){let tot=0,n=0;T.forEach((t,i)=>{if(S.best[i]!=null){tot+=S.best[i];n++}});
const id=ui(`<div class="panel"><h3 class="c">เลือกหัวข้อที่ต้องการเรียนรู้</h3><div class="grid">${T.map((t,i)=>`<button class="tile" onclick="scene(${i})"><span>${t.i}</span>${t.n}<br>${S.best[i]!=null?'⭐ '+S.best[i]+'/10':''}</button>`).join('')}</div><p class="c">เรียนแล้ว ${n}/8 หัวข้อ · คะแนนรวม ${tot}/80 ${n==8?(tot>=64?'🏆 Cyber Guard ยอดเยี่ยม!':'ลองทบทวนอีกนิดนะ'):''}</p><div class="c"><button class="btn" style="background:#4a90e2" onclick="mute=!mute;speechSynthesis&&speechSynthesis.cancel();this.textContent=mute?'🔇 เสียงปิด':'🔊 เสียงเปิด'">🔊 เสียงเปิด</button></div></div>`);say('เลือกหัวข้อที่อยากเรียนได้เลยจ้ะ','g')}
async function scene(i){const t=T[i],id=ui(`<div class="panel c"><h3>${t.i} ${t.n}</h3><p>ตัวละครกำลังพูดคุย... ฟังกันก่อนนะ</p><button class="btn" onclick="sim(${i})">ไปสถานการณ์จำลอง ➜</button></div>`);
await say(`สวัสดี! วันนี้เรามาเรียนเรื่อง ${t.n} กันนะ`,'b');if(cur!=id)return;await say(t.f,'g')}
function sim(i){const t=T[i];ui(`<div class="panel"><h3>🎬 สถานการณ์จำลอง</h3><div class="phone">${t.s}</div><h3>ถ้าเป็นเรา จะทำอย่างไร?</h3>${t.o.map((o,k)=>`<button class="opt" onclick="pick(${i},${k})">${'กขค'[k]}. ${o}</button>`).join('')}</div>`);say(t.s,'g')}
function pick(i,k){const t=T[i],ok=k==t.c;snd(ok);ui(`<div class="panel c"><h1>${ok?'✅':'❌'}</h1><p class="big ${ok?'ok':'no'}">${ok?'ถูกต้อง! เก่งมากเลย':'ยังไม่ปลอดภัยนะ'}</p>${ok?'':`<p>ทางที่ปลอดภัยคือ: ${t.o[t.c]}</p>`}<button class="btn" onclick="summ(${i})">ดูสรุปบทเรียน ➜</button>${ok?'':`<button class="btn" style="background:#4a90e2" onclick="sim(${i})">ลองใหม่</button>`}</div>`);say(ok?'ถูกต้อง! เก่งมากเลย':'ยังไม่ปลอดภัยนะ ลองคิดใหม่ดูนะ',ok?'b':'g')}
function summ(i){const t=T[i],p=t.p.split('|');ui(`<div class="panel"><h3>📝 สรุปสิ่งที่ได้เรียนรู้</h3>${p.map(x=>`<div class="phone" style="margin:6px 0">✔ ${x}</div>`).join('')}<div class="c"><button class="btn" onclick="startQ(${i})">ทำแบบทดสอบ 10 ข้อ ✏️</button></div></div>`);say('สรุปนะ '+p.join(' '),'g')}
function startQ(i){Q={i,n:0,sc:0,l:T[i].q.split('\n').map(x=>x.split('|'))};qz()}
function qz(){const [t]=Q.l[Q.n];ui(`<div class="panel"><div class="bar"><i style="width:${Q.n*10}%"></i></div><h3>ข้อ ${Q.n+1}/10</h3><p class="big">${t}</p><div id="fb" class="c"><button class="btn" style="background:var(--ok)" onclick="ans(1)">✔ ถูก</button><button class="btn" style="background:var(--no)" onclick="ans(0)">✘ ผิด</button></div></div>`);say(t,'b')}
function ans(v){const a=+Q.l[Q.n][1],ok=v==a;if(ok)Q.sc++;snd(ok);$('fb').innerHTML=`<p class="big ${ok?'ok':'no'}">${ok?'ถูกต้อง! 🎉':'ไม่ถูกนะ คำตอบคือ '+(a?'ถูก':'ผิด')}</p><button class="btn" onclick="nx()">${Q.n<9?'ข้อต่อไป ➜':'ดูผลคะแนน 🏆'}</button>`;say(ok?'เก่งมาก!':'ไม่เป็นไร ข้อหน้าสู้ๆ นะ',ok?'g':'b')}
function nx(){Q.n++;Q.n<10?qz():res()}
function res(){const s=Q.sc;S.best[Q.i]=Math.max(S.best[Q.i]||0,s);ui(`<div class="panel c"><h1>${s>=8?'🏆':s>=5?'🌟':'💪'} ยินดีด้วย!</h1><p class="big">คุณได้ ${s} / 10 คะแนน</p><div class="bar"><i style="width:${s*10}%"></i></div><p>${s>=8?'ระดับ Cyber Guard ผู้พิทักษ์ไซเบอร์!':s>=5?'ดีมาก! ทบทวนอีกนิดจะเก่งขึ้นอีก':'ไม่เป็นไร ลองเรียนอีกรอบนะ'}</p><button class="btn" onclick="startQ(${Q.i})">ทำใหม่</button><button class="btn" style="background:#4a90e2" onclick="menu()">กลับหน้าเมนู</button></div>`);say(s>=8?'เยี่ยมไปเลย! คุณเป็นผู้พิทักษ์ไซเบอร์แล้ว':'พยายามได้ดีมากเลย','g')}
home();
</script></body></html>
